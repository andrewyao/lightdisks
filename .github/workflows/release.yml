name: release

# Cut a release with ./scripts/release.sh, which pushes a v* tag.
# Ships macOS Apple Silicon and Intel .dmgs, each holding LightDisks.app. The
# Intel .dmg is cross-built on the Apple Silicon runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Read-only by default. Only the release job, which holds no signing secrets,
# gets write access to create the GitHub Release.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: lightdisks-macos-arm64
          - target: x86_64-apple-darwin   # GitHub's Intel runners are being retired
            name: lightdisks-macos-x86_64

    runs-on: macos-26

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      # A manual run on a branch has no tag, so the bundle keeps Info.plist's version.
      - name: Stamp the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "LIGHTDISKS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Puts the Developer ID certificate in a throwaway keychain and the
      # notary API key on disk for make-dmg.sh. Without the secrets the
      # build ships ad-hoc signed.
      - name: Import signing identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -z "$MACOS_CERT_P12" ]]; then
            echo "No signing secrets; building ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # Sign by the certificate's hash, read from the imported .p12, so no
          # hand-typed name has to match it.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "error: MACOS_CERT_P12 holds no Developer ID Application identity; it has:" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"

      - name: Build and package
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ./scripts/make-dmg.sh ${{ matrix.target }} "${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
